<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytor tabel</title>
    <link rel="preload" href="css/style.css" as="style">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="editor"></div>
<hr>

<label>CSS class name</label>
<input id="className" placeholder="my-table">

<button id="generate">Generate CSS</button>

<textarea id="output" rows="10"></textarea>

<button id="copy">Copy</button>
<button id="download">Download CSS</button>

<table data-et-preview>
    <thead>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>John</td>
        <td>25</td>
        <td>New York</td>
    </tr>
    <tr>
        <td>Anna</td>
        <td>30</td>
        <td>London</td>
    </tr>
    </tbody>
</table>

<hr>

<table>
    <thead>
    <tr>
        <th>Test 1</th>
        <th>Test 2</th>
        <th>Test 3</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>Test</td>
        <td>Test</td>
        <td>Test</td>
    </tr>
    <tr>
        <td>Test</td>
        <td>Test</td>
        <td>Test</td>
    </tr>
    </tbody>
</table>

<script src="js/script.js"></script>
</body>
</html>
