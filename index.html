<!doctype html>
<html lang="pl">
  <head>
    <!-- ================================================================
         EDYTOR TABEL - Strona główna
         ================================================================ -->

    <!-- Meta tagi -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edytor Tabel</title>

    <!-- Preload i link do stylów CSS -->
    <link
      rel="preload"
      href="css/style.css"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ================================================================
         GŁÓWNY KONTENER APLIKACJI
         ================================================================ -->
    <div class="app-container">

      <!-- ================================================================
           GÓRNY PASEK - ZAKŁADKI SEKCJI
           ================================================================ -->
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="table">Table</button>
        <button class="tab-btn" data-tab="header">Header</button>
        <button class="tab-btn" data-tab="footer">Footer</button>
        <button class="tab-btn" data-tab="body">Body</button>
        <button class="tab-btn" data-tab="cells">Cells</button>
        <button class="tab-btn" data-tab="rows">Rows</button>
      </div>

      <!-- ================================================================
           INTERFEJS EDYTORA - KONTROLKI
           Kontener na dynamicznie generowane kontrolki dla wybranej zakładki
           (generowane przez script.js)
           ================================================================ -->
      <div class="editor"></div>

      <!-- ================================================================
           PRZYKŁADOWA TABELA DO PODGLĄDU
           Tabela z atrybutem data-et-preview jest stylowana przez edytor.
           Użytkownik widzi na niej efekty zmian w czasie rzeczywistym.
           ================================================================ -->
      <div class="preview-container">
        <h3>Podgląd tabeli</h3>
        <table data-et-preview>
          <!-- Nagłówek tabeli -->
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>City</th>
            </tr>
          </thead>

          <!-- Ciało tabeli -->
          <tbody>
            <tr>
              <td>John</td>
              <td>25</td>
              <td>New York</td>
            </tr>
            <tr>
              <td>Anna</td>
              <td>30</td>
              <td>London</td>
            </tr>
            <tr>
              <td>Mike</td>
              <td>28</td>
              <td>Paris</td>
            </tr>
          </tbody>

          <!-- Stopka tabeli -->
          <tfoot>
            <tr>
              <td colspan="3">Total: 3 records</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- ================================================================
           SEKCJA GENEROWANIA I WCZYTYWANIA CSS
           ================================================================ -->
      <div class="css-section">

        <!-- Switch dla trybu Generate/Load -->
        <div class="mode-switch-container">
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="generate">Generate CSS</button>
            <button class="mode-btn" data-mode="load">Load CSS</button>
          </div>
        </div>

        <!-- Tryb Generate CSS -->
        <div class="mode-content" id="generate-mode">
          <div class="css-input-row">
            <label for="className">Nazwa klasy CSS:</label>
            <input id="className" placeholder="my-table" />
            <button id="generate" class="primary-btn">Generuj CSS</button>
          </div>
          <textarea id="output" placeholder="Tu pojawi się wygenerowany kod CSS..." readonly></textarea>
        </div>

        <!-- Tryb Load CSS -->
        <div class="mode-content hidden" id="load-mode">
          <div class="css-input-row">
            <label for="css-input">Wklej kod CSS:</label>
            <button id="load" class="primary-btn">Wczytaj CSS</button>
          </div>
          <textarea id="css-input" placeholder="Wklej tutaj kod CSS do wczytania..."></textarea>
        </div>

      </div>

    </div>

    <!-- ================================================================
         SKRYPT JAVASCRIPT
         ================================================================ -->
    <script src="js/script.js"></script>
  </body>
</html>
