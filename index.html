<!doctype html>
<html lang="pl">
  <head>
    <!-- ================================================================
         EDYTOR TABEL - Strona główna
         ================================================================ -->

    <!-- Meta tagi -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edytor Tabel</title>

    <!-- Preload i link do stylów CSS -->
    <link
      rel="preload"
      href="css/style.css"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ================================================================
         GŁÓWNY KONTENER APLIKACJI
         ================================================================ -->
    <div class="app-container">

      <!-- ================================================================
           GÓRNY PASEK - ZAKŁADKI SEKCJI I RESET
           ================================================================ -->
      <div class="header-bar">
        <div class="tabs-container">
          <button class="tab-btn active" data-tab="table">Table</button>
          <button class="tab-btn" data-tab="header" id="headerTab">Header</button>
          <button class="tab-btn" data-tab="footer" id="footerTab">Footer</button>
          <button class="tab-btn" data-tab="body">Body</button>
          <button class="tab-btn" data-tab="cells">Cells</button>
          <button class="tab-btn" data-tab="rows">Rows</button>
        </div>
        <button class="reset-all-btn" id="resetAll" title="Zresetuj wszystkie wartości do domyślnych">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13.65 2.35C12.2 0.9 10.21 0 8 0C3.58 0 0.01 3.58 0.01 8C0.01 12.42 3.58 16 8 16C11.73 16 14.84 13.45 15.73 10H13.65C12.83 12.33 10.61 14 8 14C4.69 14 2 11.31 2 8C2 4.69 4.69 2 8 2C9.66 2 11.14 2.69 12.22 3.78L9 7H16V0L13.65 2.35Z" fill="currentColor"/>
          </svg>
          Reset All
        </button>
      </div>

      <!-- ================================================================
           INTERFEJS EDYTORA - KONTROLKI
           Kontener na dynamicznie generowane kontrolki dla wybranej zakładki
           (generowane przez script.js)
           ================================================================ -->
      <div class="editor-container">
        <div class="editor-header">
          <button class="reset-section-btn" id="resetSection" title="Zresetuj wszystkie wartości w tej sekcji">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13.65 2.35C12.2 0.9 10.21 0 8 0C3.58 0 0.01 3.58 0.01 8C0.01 12.42 3.58 16 8 16C11.73 16 14.84 13.45 15.73 10H13.65C12.83 12.33 10.61 14 8 14C4.69 14 2 11.31 2 8C2 4.69 4.69 2 8 2C9.66 2 11.14 2.69 12.22 3.78L9 7H16V0L13.65 2.35Z" fill="currentColor"/>
            </svg>
            Reset Section
          </button>
        </div>
        <div class="editor"></div>
      </div>

      <!-- ================================================================
           PRZYKŁADOWA TABELA DO PODGLĄDU
           Tabela z atrybutem data-et-preview jest stylowana przez edytor.
           Użytkownik widzi na niej efekty zmian w czasie rzeczywistym.
           ================================================================ -->
      <div class="preview-container">
        <h3>Podgląd tabeli</h3>
        <table data-et-preview>
          <!-- Nagłówek tabeli -->
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>City</th>
            </tr>
          </thead>

          <!-- Ciało tabeli -->
          <tbody>
            <tr>
              <td>John</td>
              <td>25</td>
              <td>New York</td>
            </tr>
            <tr>
              <td>Anna</td>
              <td>30</td>
              <td>London</td>
            </tr>
            <tr>
              <td>Mike</td>
              <td>28</td>
              <td>Paris</td>
            </tr>
          </tbody>

          <!-- Stopka tabeli -->
          <tfoot>
            <tr>
              <td colspan="3">Total: 3 records</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- ================================================================
           SEKCJA GENEROWANIA I WCZYTYWANIA CSS
           ================================================================ -->
      <div class="css-section">

        <!-- Switch dla trybu Generate/Load -->
        <div class="mode-switch-container">
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="generate">Generate CSS</button>
            <button class="mode-btn" data-mode="load">Load CSS</button>
          </div>
        </div>

        <!-- Tryb Generate CSS -->
        <div class="mode-content" id="generate-mode">
          <div class="css-input-row">
            <label for="className">Nazwa klasy CSS:</label>
            <input id="className" placeholder="my-table" />
            <button id="generate" class="primary-btn">Generuj CSS</button>
          </div>
          <textarea id="output" placeholder="Tu pojawi się wygenerowany kod CSS..." readonly></textarea>
        </div>

        <!-- Tryb Load CSS -->
        <div class="mode-content hidden" id="load-mode">
          <div class="css-input-row">
            <label for="css-input">Wklej kod CSS:</label>
            <button id="load" class="primary-btn">Wczytaj CSS</button>
          </div>
          <textarea id="css-input" placeholder="Wklej tutaj kod CSS do wczytania..."></textarea>
        </div>

      </div>

    </div>

    <!-- ================================================================
         SKRYPT JAVASCRIPT
         ================================================================ -->
    <script src="js/script.js"></script>
  </body>
</html>
